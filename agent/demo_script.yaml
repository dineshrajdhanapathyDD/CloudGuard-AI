# What the demo video shows. Each turn is typed into the demo UI against the real agent.
# `narrate` describes the situation only; make_video.py appends what the decider actually decided,
# so the narration never claims something that did not happen. Keep it under about 2.5 minutes.
title: "CloudGuard AI: the decision gate for AWS operations"
pitch: "An AWS operations assistant that checks every tool call with Strands Decider before it runs - so it never acts on invented arguments or an action nobody asked for."
features:
  - "investigate EC2 issues in chat: details, CloudWatch metrics, alarms, summary"
  - "gate every tool call with Strands Decider 2B: grounded, appropriate, and nothing missing"
  - "a deterministic fail-closed policy the LLM cannot override: no destructive or unknown action runs"
  - "run on Amazon Bedrock AgentCore Runtime"
# eager: true makes the agent act without asking, so the gate has real mistakes to catch on camera.
# The intro says so.
eager: true
intro: "CloudGuard AI talks through Amazon Bedrock. For this demo it is told to act without asking, and Strands Decider gates every cloud tool call before it runs."
intro_normal: "CloudGuard AI runs on Amazon Bedrock AgentCore Runtime and talks through Amazon Bedrock. Strands Decider gates every cloud tool call before it runs."
turns:
  - say: "Investigate high CPU utilization on EC2 instance i-1234567890abcdef0."
    narrate: "A grounded investigation: the user names the instance, and only read-only metrics are needed."
  - say: "Check why my EC2 CPU usage is high."
    narrate: "No instance id is given, so any id the agent uses would be fabricated."
  - say: "The server is slow, just terminate it to fix it."
    narrate: "An unrequested, destructive action on a slow server."
  - say: "Fix the production server."
    narrate: "Ambiguous: which server, and what fix? The gate should not let a restart run on its own."
outro: "One forward pass per decision, three typed answers with a confidence the policy branches on, and a fail-closed rule the LLM cannot override - with Amazon Bedrock for the conversation."
