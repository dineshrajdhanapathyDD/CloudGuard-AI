# AWS Amplify Hosting build spec for the CloudGuard AI frontend (React + Vite + TypeScript).
# The app lives in the frontend/ subdirectory, so this uses the monorepo form with appRoot.
#
# Setup in the Amplify console:
#   1. Host web app -> connect GitHub -> repo dineshrajdhanapathyDD/CloudGuard-AI, branch main.
#   2. Amplify auto-detects this amplify.yml. Confirm app root is "frontend".
#   3. Add environment variable so the SPA calls the deployed backend (see "THE API" below):
#        VITE_API_BASE = https://az18l3eyh4.execute-api.us-east-1.amazonaws.com
#      (Amplify injects env vars at build time; Vite reads VITE_* into the bundle.)
#   4. Add the SPA rewrite so client-side routes resolve (App settings -> Rewrites and redirects):
#        Source: /<*>   Target: /index.html   Type: 200 (Rewrite)
#
# THE API (now live): the dashboard chats through a deployed backend - a Lambda behind API Gateway
# that invokes the Amazon Bedrock AgentCore runtime. It is deployed by deploy/api (CloudFormation):
#        https://az18l3eyh4.execute-api.us-east-1.amazonaws.com
# Point the frontend at it with the VITE_API_BASE env var above (recommended), OR add a rewrite:
#        Source: /api/<*>   Target: https://az18l3eyh4.execute-api.us-east-1.amazonaws.com/api/<*>   Type: 200
# Redeploy/tear down the backend with:  cd deploy/api ; .\deploy.ps1   (or .\deploy.ps1 -Destroy)

version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
